[workspace]
members = [
    "Build/komado-core",
    "Build/komado-png"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "dev"
strip = "none"
debug = true
