name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only (skip GitHub release upload)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release Komado
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: komado

      - name: Run tests
        working-directory: komado
        run: cargo test

      - name: Run clippy
        working-directory: komado
        run: cargo clippy --release --all-features -- -D warnings

      - name: Check formatting
        working-directory: komado
        run: cargo fmt --check

      - name: Build release
        working-directory: komado
        run: cargo build --release

      - name: Build WASM library
        working-directory: komado
        run: wasm-pack build --release --target web

      - name: Generate C bindings
        working-directory: komado
        run: # todo: however I generate bindings...

      - name: Create release archive
        run: |
          set -e
          ROOT_DIR="${GITHUB_WORKSPACE}"
          CRATE_DIR="${ROOT_DIR}/komado"
          ARCHIVE_NAME="komado-${{ github.ref_name }}.tar.gz"

          rm -rf /tmp/komado-release
          mkdir -p /tmp/komado-release/lib /tmp/komado-release/include

          # Include platform-specific native artifacts only when present.
          for artifact in \
            "${CRATE_DIR}/target/release/libkomado.so" \
            "${CRATE_DIR}/target/release/libkomado.dylib" \
            "${CRATE_DIR}/target/release/libkomado.a" \
            "${CRATE_DIR}/target/release/komado.dll"
          do
            if [ -f "$artifact" ]; then
              cp "$artifact" /tmp/komado-release/lib/
            fi
          done

          cp -R "${CRATE_DIR}/include/." /tmp/komado-release/include/
          cp -R "${CRATE_DIR}/pkg" /tmp/komado-release/pkg
          cp "${CRATE_DIR}/README.md" /tmp/komado-release/README.md
          cp "${CRATE_DIR}/LICENSE" /tmp/komado-release/LICENSE

          tar -czf "${ROOT_DIR}/${ARCHIVE_NAME}" -C /tmp/komado-release .

      - name: Create GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          files: komado-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
